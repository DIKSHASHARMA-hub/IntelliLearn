<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IntelliLearn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/auth.css}" href="/css/auth.css">
  <style>
    .landing-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .landing-card {
      max-width: 520px;
      width: 100%;
      background: var(--paper-card);
      border-radius: var(--radius);
      padding: 44px;
      box-shadow: 0 24px 60px -20px rgba(20, 33, 61, 0.25);
      text-align: center;
    }
    .role-badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--highlighter-soft);
      color: #6b5900;
      margin-bottom: 18px;
    }
    .landing-card h1 {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 500;
      margin: 0 0 10px;
    }
    .landing-card p {
      color: var(--ink-muted);
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 28px;
    }
    .logout-btn {
      border: 1.5px solid var(--line);
      background: none;
      color: var(--ink);
      padding: 11px 20px;
      border-radius: 10px;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .logout-btn:hover { border-color: var(--ink); }
  </style>
</head>
<body>
  <div class="landing-shell">
    <div class="landing-card">
      <span class="role-badge" id="roleBadge">ROLE</span>
      <h1 id="welcomeMsg">Welcome</h1>
      <p>The full dashboard for your role is coming next — for now, you're signed in and your session is active.</p>
      <button class="logout-btn" onclick="ilLogout()">Log out</button>
    </div>
  </div>

  <script th:src="@{/js/auth.js}" src="/js/auth.js"></script>
  <script>
    const user = ilGetUser();
    if (!user || !ilGetToken()) {
      window.location.href = '/login';
    } else if (user.role === 'TEACHER') {
      window.location.href = '/teacher/dashboard';
    } else if (user.role === 'STUDENT') {
      window.location.href = '/student/dashboard';
    } else {
      document.getElementById('roleBadge').textContent = user.role;
      document.getElementById('welcomeMsg').textContent = 'Welcome, ' + user.firstName + '.';
    }
  </script>
</body>
</html>
