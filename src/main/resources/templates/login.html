<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in · IntelliLearn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/auth.css}" href="/css/auth.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">

      <div class="ink-panel">
        <div class="brand-mark">IntelliLearn</div>
        <h1>
          Notes in.<br>
          <span class="highlight-word" id="rotatingWord">Practice.</span><br>
          <em>out.</em>
        </h1>
        <p class="sub">Upload notes, get a quiz. IntelliLearn reads your notes and asks you the questions that matter.</p>

        <div class="quiz-chips">
          <span class="quiz-chip">Q: What is JVM?</span>
          <span class="quiz-chip correct">B. Java Virtual Machine</span>
        </div>
      </div>

      <div class="form-panel">
        <p class="form-eyebrow">Welcome back</p>
        <h2>Log in to your account</h2>
        <p class="lead">Enter your credentials to continue.</p>

        <div class="form-message" id="formMessage"></div>

        <form id="loginForm" onsubmit="return false;">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">Log in</button>
        </form>

        <p class="switch-link">Don't have an account? <a th:href="@{/register}" href="/register">Create one</a></p>
      </div>

    </div>
  </div>

  <script th:src="@{/js/auth.js}" src="/js/auth.js"></script>
  <script>
    
    const words = ['Practice.', 'Progress.', 'Mastery.'];
    let wIndex = 0;
    const wordEl = document.getElementById('rotatingWord');
    setInterval(() => {
      wIndex = (wIndex + 1) % words.length;
      wordEl.style.animation = 'none';
      wordEl.textContent = words[wIndex];
      void wordEl.offsetWidth; 
      wordEl.style.animation = '';
    }, 3600);

    const form = document.getElementById('loginForm');
    const messageEl = document.getElementById('formMessage');

    if (new URLSearchParams(window.location.search).get('registered') === '1') {
      ilShowMessage(messageEl, 'Account created! Log in to continue.', 'success');
    }
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', () => {
      const payload = {
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
      };
      ilSubmitForm('/api/users/login', payload, messageEl, submitBtn);
    });
  </script>
</body>
</html>
